[project]
name = "antibody"
version = "0.3.0"
description = "Every fix becomes a rule your AI coding agent can't break: verified Semgrep rules enforced on agent edits, commits and CI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "ruamel.yaml>=0.18",
]
keywords = [
    "ai", "coding-agent", "claude-code", "codex", "cursor", "github-copilot", "gemini-cli",
    "agents-md", "semgrep", "opengrep", "static-analysis", "lint", "pre-commit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]

[project.urls]
Repository = "https://github.com/cipheraxat/antibody"
Documentation = "https://github.com/cipheraxat/antibody/tree/main/docs"
Issues = "https://github.com/cipheraxat/antibody/issues"

[project.optional-dependencies]
# The rule engine. Skip this extra if you already have opengrep or semgrep on PATH.
semgrep = ["semgrep>=1.100"]

[project.scripts]
antibody = "antibody.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "semgrep>=1.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antibody"]

[tool.pytest.ini_options]
testpaths = ["tests"]
