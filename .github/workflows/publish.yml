name: publish

# Publishes to PyPI when a GitHub release is published. It uses trusted publishing, so no
# token is stored anywhere. One-time setup on PyPI: add a pending publisher with owner
# "cipheraxat", repository "antibody", workflow "publish.yml" and environment "pypi".

on:
  release:
    types: [published]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false # no shared cache in a release workflow
      - run: uv sync --frozen
      - run: uv run pytest -q

  pypi:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/antibody
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Check the release tag matches the package version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: uv build
      - run: uv publish --trusted-publishing always
