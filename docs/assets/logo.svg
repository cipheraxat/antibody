<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 1.5 136 136" role="img" aria-labelledby="title">
  <title id="title">antibody</title>
  <!-- a white tile, so the dark mark also reads on dark backgrounds; the mark sits centered in it -->
  <rect x="-4" y="1.5" width="136" height="136" rx="30" fill="#ffffff"/>
  <g fill="none" stroke="#1b1915" stroke-linecap="round" stroke-linejoin="round">
    <!-- heavy chains: the Y -->
    <path d="M64 114V70L36 30M64 70l28-40" stroke-width="11"/>
    <!-- light chains alongside each arm -->
    <path d="M40.8 59.4 25.4 37.4M87.2 59.4l15.4-22" stroke-width="7"/>
  </g>
  <!-- binding sites: where an antibody recognizes what it learned -->
  <circle cx="30.5" cy="25.5" r="6" fill="#d16e4c"/>
  <circle cx="97.5" cy="25.5" r="6" fill="#d16e4c"/>
</svg>
